<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">FIRDAUS BUILDS Workflow Rescue Diagnostic</title>
  <desc id="desc">A before and after visual: repeated copying between WhatsApp and spreadsheets becomes one clear workflow map and next step.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0f14"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity="0.32"/>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect x="42" y="42" width="1116" height="546" rx="28" fill="none" stroke="#263241"/>
  <text x="82" y="112" fill="#22c55e" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" letter-spacing="4">FIRDAUS BUILDS</text>
  <text x="82" y="178" fill="#f8fafc" font-family="Arial, Helvetica, sans-serif" font-size="52" font-weight="700">Make work</text>
  <text x="82" y="236" fill="#f8fafc" font-family="Arial, Helvetica, sans-serif" font-size="52" font-weight="700">make sense.</text>
  <text x="84" y="278" fill="#a8b3c2" font-family="Arial, Helvetica, sans-serif" font-size="20">Workflow Rescue Diagnostic · RM350</text>

  <g filter="url(#shadow)">
    <rect x="82" y="330" width="438" height="174" rx="18" fill="#151d28" stroke="#d97706" stroke-opacity="0.7"/>
    <text x="112" y="374" fill="#f59e0b" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" letter-spacing="2">TODAY</text>
    <text x="112" y="418" fill="#f8fafc" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700">WhatsApp → spreadsheet</text>
    <text x="112" y="454" fill="#cbd5e1" font-family="Arial, Helvetica, sans-serif" font-size="19">retype → check twice → chase</text>
    <text x="112" y="482" fill="#94a3b8" font-family="Arial, Helvetica, sans-serif" font-size="16">The latest version is hard to trust.</text>
  </g>

  <text x="557" y="430" fill="#22c55e" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="700">→</text>

  <g filter="url(#shadow)">
    <rect x="680" y="330" width="400" height="174" rx="18" fill="#14231d" stroke="#22c55e" stroke-opacity="0.9"/>
    <text x="710" y="374" fill="#22c55e" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" letter-spacing="2">NEXT SLICE</text>
    <text x="710" y="418" fill="#f8fafc" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700">one clear owner</text>
    <text x="710" y="454" fill="#cbd5e1" font-family="Arial, Helvetica, sans-serif" font-size="18">checked hand-off → status</text>
    <text x="710" y="482" fill="#94a3b8" font-family="Arial, Helvetica, sans-serif" font-size="16">Decide before a large rebuild.</text>
  </g>

  <text x="82" y="556" fill="#64748b" font-family="Arial, Helvetica, sans-serif" font-size="16">Workflow Rescue Diagnostic · Penang + remote · fdfrontdev.github.io/web-profile-deploy/</text>
</svg>
